<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h2>JS STRING METHODS</h2>
    <p>Basic methods</p>

    <script>
        var str = "AmAzInG";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        document.write("<br>");

        //test method -> returns to true or false
        var str1 = "Change da world.My final message good by";
        var patt = new RegExp("about");
        var res = patt.test(str1);
        document.write(res);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY OWN</title>
</head>
<body>
    <h2>JavaScript Arrays</h2>
    <h2>Join() and Pop()</h2>

<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>

<script>
    var fruits = ["Banana", "Orange", "Apple", "Mango"];
    document.getElementById("myjoin").innerHTML = fruits.join(" * ");
    document.getElementById("myfirstpop").innerHTML = fruits.pop();
    document.getElementById("mysecondpop").innerHTML = fruits.pop();
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Profile</title>

<style>
body {

font-family: Arial, sans-serif;

background: aliceblue;

text-align: center;

padding: 30px;

}

h1 { color: navy; }

button {

background: navy;

color: white;

padding: 10px 25px;

border: none;

border-radius: 20px;

cursor: pointer;

}

div {

border: 1px solid navy;

width: 280px;

margin: 6px auto;

padding: 8px 12px;

text-align: left;

border-radius: 6px;

}
</style>
</head>
<body>
   <h1>Game Profile</h1> 
   <button onclick="ShowProfile()">Show Profile</button>

<!-- Recordings -->

<div> Name: <span id="name"></span></div>
<div> Score: <span id="score"></span></div>
<div> Level: <span id="level"></span></div>
<div> Top Score: <span id="record"></span></div>
<div> Rank: <span id="rank"></span></div>
<div> Games Played: <span id="gamesPlayed"></span></div>
<div> Greeting: <span id="greeting"></span></div>
<div> Bonus: <span id="bonus"></span></div>
<div> Stars: <span id="stars"></span></div>
<div> Status: <span id="status"></span></div>
<div> Bonus Level: <span id="bonusLevel"></span></div>
<div> Team Name: <span id="team"></span></div>

<script>
    function ShowProfile() {
        // Variable

        let name = "Funky Friday";
        let Myscore = 75;
        let highScore = 100;
        let bonus = null;
        let team;

        // Comparsion Operator

        let istopscore = Myscore == highScore;

        // if / else - rank

        let rank;

        if (Myscore >= 80 - 70) {
            rank = "gold";
    } else if (Myscore >= 70 - 60) {
        rank = "silver";
    } else {
        rank = "bronze";
    }

    // Date Object - greeting

let hour = new Date().getHours();
let greeting;
if (hour < 12){
    greeting = "Good Morning";
} else if (hour < 18) {
    greeting = "Good Afternoon";
} else {
    greeting = "Good Evening";
}

// While Loop - Stars
let stars = "";
let count = 0;
while (count < 5) {
    stars = stars + "* ";
    count = count + 1;
}

// String Concentation - Show on Page
document.getElementById("name").innerHTML = name;
document.getElementById("score").innerHTML =  Myscore + " out of" + highScore;

document.getElementById("record").innerHTML = isTopscore;
document.getElementById("rank").innerHTML = rank;
document.getElementById("greeting").innerHTML = greeting;
document.getElementById("stars").innerHTML = stars;
document.getElementById("bonus").innerHTML = bonus;
document.getElementById("team").innerHTML = team;


    }


</script>
</body>
</html>

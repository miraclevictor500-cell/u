     <div class="zone">Zone 2: <span id="zone2"></span></div>

<button onclick="OpenZoo()">Open the Zoo!!!</button>

<p id="zoo-status"></p>

<script>

    function OpenZoo() {
        /* Task 1:Add you first animal in zone 1*/
        document.getElementById("zone1").innerHTML = "Lion";

        document.getElementById("zone2").innerHTML = "Elephant";

         /* Task 4: Calculate the total number of animals in the zoo and display it in the "Total Animals" section*/
         document.getElementById("total").innerHTML = 3;

         /* Task 5: Change the zoo background color */
         document.getElementById("zoo").style.backgroundColor = "lightgreen";

         /* Task 6: Use the document object to show the page title in the "zoo-status" section*/
         document.getElementById("zoo-status").innerHTML = "Welcome to the Zoo! Enjoy your visit!";
    }
